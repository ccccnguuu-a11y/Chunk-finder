
name: Build ChunkFinder JAR

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          mkdir -p extracted

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -q "$ZIP" -d extracted

          PROJECT_FILE="$(find extracted -type f -name build.gradle -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "build.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      
      - name: Fix Fabric Loom plugin
        shell: bash
        run: |
          sed -i -E "/fabric-loom/s/(version[[:space:]]+['\"])[^'\"]+(['\"])/\11.14\2/" "$PROJECT_DIR/build.gradle"
          grep -n "fabric-loom" "$PROJECT_DIR/build.gradle"
          
          echo "Updated Loom plugin:"
          head -n 8 "$PROJECT_DIR/build.gradle"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChunkFinder-1.21.11-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
